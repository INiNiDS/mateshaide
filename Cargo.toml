[package]
name = "mateshaide"
version = "0.1.0"
edition = "2024"
description = "IDE For Mathematics."
license = "AGPL-3.0"
repository = "https://github.com/ininids/mateshaide"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "matesha_ide"
path = "src/main.rs"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
anyhow = "1"
tracing = "0.1"
thiserror = "2"

glam = { version = "*", features = ["bytemuck"] }
bytemuck = { version = "*", features = ["derive"] }
hashbrown = "*"
rustc-hash = "*"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
tracing-subscriber = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
