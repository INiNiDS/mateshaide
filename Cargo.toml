[package]
name = "matesha_ide"
version = "0.1.0"
edition = "2024"
description = "IDE For Mathematics."
license = "AGPL-3.0"
repository = "https://github.com/ininids/mateshaide"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mateshaide-native"
path = "src/main.rs"

[dependencies]
wgpu = "30.0.1"
winit = "0.30.13"
anyhow = "1"
tracing = "0.1"
thiserror = "2"

glam = { version = "*", features = ["bytemuck"] }
bytemuck = { version = "*", features = ["derive"] }
hashbrown = "*"
rustc-hash = "*"
web-time = "1.1.0"
glyphon = "0.12.0"
printpdf = "0.12.8"
image = "0.25.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0.1"
tracing-subscriber = "0.3"
rfd = "0.17.2"
arboard = { version = "3", features = ["wayland-data-control"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
tracing-wasm = "0.2"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "Node",
    "HtmlCanvasElement", "HtmlAnchorElement",
    "Blob", "BlobPropertyBag", "Url",
    "Navigator", "Clipboard", "ClipboardItem",
] }
js-sys = "0.3.106"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
unreadable_literal = "allow"
many_single_char_names = "allow"
similar_names = "allow"
too_many_lines = "allow"
pub_underscore_fields = "allow"
module_inception = "allow"
cast_possible_wrap = "allow"

dbg_macro = "warn"
todo = "warn"
clone_on_ref_ptr = "warn"
